name: R package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: oldrel-1}
          - {os: ubuntu-latest, r: devel}
          - {os: windows-latest, r: release}
          - {os: macos-latest, r: release}
    env:
      TMPDIR: ${{ github.workspace }}/arbeit/tmp
      TEMP: ${{ github.workspace }}/arbeit/tmp
      TMP: ${{ github.workspace }}/arbeit/tmp
      R_LIBS_USER: ${{ github.workspace }}/arbeit/tmp/library
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - name: Local directories
        shell: bash
        run: mkdir -p arbeit/tmp/library
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
      - name: Dependencies
        shell: Rscript {0}
        run: install.packages('jsonlite', repos='https://cloud.r-project.org')
      - name: Build tarball
        shell: bash
        run: R CMD build source
      - name: Check tarball
        shell: bash
        run: R CMD check --as-cran --no-manual bsikompendium_*.tar.gz
